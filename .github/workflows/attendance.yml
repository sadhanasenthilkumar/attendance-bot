name: Daily Attendance

on:
  schedule:
    # Runs every day at 4:30 PM IST (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:  # optional: allows manual run from GitHub

jobs:
  send-attendance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium python-telegram-bot

      - name: Run Attendance Script
        run: python attendance.py
